<div id="sim-galeria-view" class="view-overlay gal-theme">
  <div class="sim-coach-lou">
    <div id="gal-instruction">
      <strong id="gal-step-label">Passo 1:</strong>
      <span id="gal-step-text"
        >Você está na Câmera! Toque no botão redondo para tirar uma foto, ou no
        quadradinho à esquerda para abrir a Galeria.</span
      >
    </div>
    <button
      class="btn-close-sim"
      onclick="app.closeSimulation('sim-galeria-view')"
    >
      <span class="material-symbols-outlined">close</span> Sair
    </button>
  </div>

  <div id="gal-camera-screen" class="gal-camera-container">
    <div class="gal-viewfinder" id="gal-viewfinder">
      <div class="gal-focus-box"></div>
      <div id="gal-flash-effect" class="hidden"></div>
    </div>

    <div class="gal-camera-controls">
      <button class="gal-btn-thumbnail" onclick="app.goToGallery()"></button>

      <button class="gal-btn-shutter" onclick="app.takePhoto()"></button>

      <button class="gal-btn-switch" onclick="app.switchCamera()">
        <span class="material-symbols-outlined text-white"
          >flip_camera_android</span
        >
      </button>
    </div>
  </div>

  <div class="gal-header hidden" id="gal-main-header">
    <button class="btn-icon" onclick="app.backToCamera()">
      <span class="material-symbols-outlined">photo_camera</span>
    </button>
    <div class="gal-title">Galeria</div>
    <span class="material-symbols-outlined">search</span>
  </div>

  <div id="gal-albums-screen" class="gal-scroll-area hidden">
    <div class="gal-albums-grid">
      <div class="gal-album-card" onclick="app.openGaleriaAlbum('Câmera')">
        <div class="gal-album-cover bg-camera"></div>
        <div class="gal-album-info">
          <h4>Câmera</h4>
          <span>129 fotos</span>
        </div>
      </div>
      <div
        class="gal-album-card"
        onclick="app.openGaleriaAlbum('WhatsApp Images')"
      >
        <div class="gal-album-cover bg-whatsapp"></div>
        <div class="gal-album-info">
          <h4>WhatsApp Images</h4>
          <span>45 fotos</span>
        </div>
      </div>
      <div class="gal-album-card" onclick="app.openGaleriaAlbum('Família')">
        <div class="gal-album-cover bg-family"></div>
        <div class="gal-album-info">
          <h4>Família</h4>
          <span>12 fotos</span>
        </div>
      </div>
    </div>
  </div>

  <div id="gal-photos-screen" class="hidden">
    <div class="gal-sub-header">
      <button class="btn-icon" onclick="app.closeGaleriaAlbum()">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <h3 id="gal-album-title">Nome do Álbum</h3>
    </div>
    <div class="gal-scroll-area">
      <div class="gal-photos-grid">
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
        <div class="gal-photo-item" onclick="app.openGaleriaPhoto()"></div>
      </div>
    </div>
  </div>

  <div id="gal-fullscreen-screen" class="hidden">
    <div class="gal-fullscreen-header">
      <button class="btn-icon text-white" onclick="app.closeGaleriaPhoto()">
        <span class="material-symbols-outlined">arrow_back</span>
      </button>
      <span class="text-white">Hoje, 14:30</span>
      <span class="material-symbols-outlined text-white">more_vert</span>
    </div>
    <div class="gal-fullscreen-image"></div>
    <div class="gal-action-bar">
      <button
        class="gal-action-btn"
        onclick="app.galeriaAction('Compartilhar')"
      >
        <span class="material-symbols-outlined">share</span>
        <span>Compartilhar</span>
      </button>
      <button class="gal-action-btn" onclick="app.galeriaAction('Editar')">
        <span class="material-symbols-outlined">edit</span>
        <span>Editar</span>
      </button>
      <button class="gal-action-btn" onclick="app.galeriaAction('Apagar')">
        <span class="material-symbols-outlined">delete</span>
        <span>Apagar</span>
      </button>
    </div>
  </div>
</div>
